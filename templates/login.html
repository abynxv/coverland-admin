{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cover Land</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="login-container">
        <!-- Left Side: Branding / Visual -->
        <div class="login-left">
            <div style="text-align: center;">
                <div class="brand-icon" style="width: 80px; height: 80px; font-size: 32px; margin: 0 auto 20px; background-color: white; color: var(--accent-blue);">CL</div>
                <h1 style="font-family: var(--font-serif); font-size: 36px; margin-bottom: 10px;">Cover Land</h1>
                <p style="font-size: 14px; opacity: 0.9; letter-spacing: 2px;">SHOP MANAGEMENT SYSTEM</p>
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="login-right">
            <div class="login-form-wrapper">
                <div class="login-form">
                    <h2>Welcome back</h2>
                    <p>Please enter your details to sign in.</p>

                    <form method="post">
                        {% csrf_token %}
                        
                        {% if form.errors %}
                            <div style="color: #dc3545; font-size: 14px; margin-bottom: 15px; padding: 10px; background: #ffe6e6; border-radius: 6px;">
                                Invalid username or password.
                            </div>
                        {% endif %}

                        <div class="form-group">
                            <label for="id_username">Username</label>
                            <input type="text" name="username" id="id_username" required autofocus placeholder="Enter your username">
                        </div>

                        <div class="form-group">
                            <label for="id_password">Password</label>
                            <input type="password" name="password" id="id_password" required placeholder="Enter your password">
                        </div>

                        <button type="submit" class="btn-primary">Sign In</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
